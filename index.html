<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>鼎兆元｜電子佈告欄</title>
<link rel="stylesheet" href="css/app.css?v=0.3.4">
</head>
<body>

<div class="demo" id="demoBar" hidden>
  🧪 本機假資料｜管理通行碼 <b>1234</b>｜假同仁密碼 <b>0000</b>
  <button id="testMe">🖊 用未讀測試員登入</button> <button id="resetDemo">重置假資料</button>
</div>

<header class="top">
  <div class="in">
    <div class="logos"><img class="mzt" src="assets/logo-mzt.png" alt="墨竹亭"><img class="mala" src="assets/logo-mala.jpg" alt="麻的小辛辣"></div>
    <h1>鼎兆元<small>｜</small>電子佈告欄</h1>
    <button class="iconbtn" id="openAdmin">⚙ 設定</button>
  </div>
  <div class="me" id="meBar"></div>
</header>

<main class="wrap">
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<div class="viewer" id="viewer">
  <div class="vbar"><b id="vname"></b><button id="vclose">關閉</button></div>
  <div class="vnote">僅供線上檢視・不提供下載</div>
  <div class="vbody" id="vbody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js?v=0.3.4"></script>
<script src="js/logic.js?v=0.3.4"></script>
<script src="js/ui.js?v=0.3.4"></script>
<script src="js/api.js?v=0.3.4"></script>
<script src="js/sign.js?v=0.3.4"></script>
<script src="js/staff.js?v=0.3.4"></script>
<script src="js/admin.js?v=0.3.4"></script>
<script>
  // 本機模式才載入假後端（共用正式後端的 Service.js）
  if (CFG.MODE === 'local') {
    ['gas/Auth.js', 'gas/Service.js', 'js/mock.js'].reduce(function (p, src) {
      return p.then(function () { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src + '?v=' + CFG.VERSION; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); });
    }, Promise.resolve()).then(Staff.start, function () { UI.fatal('本機假後端載入失敗'); });
  } else {
    Staff.start();
  }
</script>
</body>
</html>
